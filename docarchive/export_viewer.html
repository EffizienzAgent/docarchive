<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'">
<title>Archive Export</title>
<style>
:root {
	--bg: #f6f8fa; --panel: #fff; --text: #1f2328; --muted: #59636e; --line: #d1d9e0;
	--accent: #0969da; --accent-bg: #ddf4ff; --bad: #cf222e; --bad-bg: #ffebe9; --hold: #9a6700; --hold-bg: #fff8c5;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #0d1117; --panel: #151b23; --text: #e6edf3; --muted: #9198a1; --line: #3d444d;
		--accent: #4493f8; --accent-bg: #121d2f; --bad: #f85149; --bad-bg: #25171c; --hold: #d29922; --hold-bg: #272115;
	}
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .top { display: flex; align-items: center; gap: 12px; }
header .titles { flex: 1; min-width: 0; }
header h1 { font-size: 18px; margin: 0 0 4px; overflow-wrap: anywhere; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.brand img { max-height: 36px; max-width: 160px; object-fit: contain; }
.help-button { flex: none; }
footer { padding: 6px 16px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; }
footer a { color: inherit; }
.scope { color: var(--muted); font-size: 13px; }
.banner { margin-top: 8px; padding: 8px 12px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); }
main { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; flex: 1; min-height: 0; }
aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.filters { padding: 12px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.filters input[type=search], .filters select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.filters label { color: var(--muted); font-size: 13px; }
.count { padding: 6px 12px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }
.list { overflow: auto; flex: 1; }
.item { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--bg); }
.item.active { background: var(--accent-bg); }
.item.cursor { box-shadow: inset 3px 0 0 var(--accent); }
.item .t { font-weight: 500; overflow-wrap: anywhere; }
.item .m { color: var(--muted); font-size: 12px; }
.more { margin: 12px; }
button, .btn { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
button:disabled { opacity: .5; cursor: default; }
.btn.primary { border-color: var(--accent); color: var(--accent); }
section.detail { overflow: auto; padding: 16px; min-width: 0; }
.nav { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; height: 32px; }
.nav h2 { font-size: 17px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav button { flex: none; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; margin-bottom: 12px; }
@media (min-width: 900px) { .fields { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1200px) { .fields { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.field { min-width: 0; height: 40px; }
.field .label { color: var(--muted); font-size: 12px; }
.field .value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field.bad .value { color: var(--bad); }
.field.hold .value { color: var(--hold); }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 10px; margin-left: 6px; }
.pill.hold { background: var(--hold-bg); color: var(--hold); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 16px; }
.card .head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card .head .name { flex: 1; font-weight: 500; overflow-wrap: anywhere; min-width: 160px; }
.card .note { padding: 6px 12px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
.card .body { padding: 12px; }
.card iframe { width: 100%; height: 70vh; border: 0; background: #fff; }
.card img { max-width: 100%; }
.thread .msg { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.thread .msg.active { background: var(--accent-bg); }
.thread .msg:last-child { border-bottom: 0; }
.muted { color: var(--muted); }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; height: 32px; overflow-x: auto; overflow-y: hidden; }
.tabs button { flex: none; max-width: 16rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
kbd { font: 12px ui-monospace, monospace; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); }
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay[hidden] { display: none; }
.overlay .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; max-width: 420px; width: 100%; }
.overlay h2 { font-size: 16px; margin: 0 0 12px; }
.overlay table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.overlay td { padding: 4px 0; vertical-align: top; }
.overlay td:first-child { white-space: nowrap; padding-right: 16px; }
ul.plain { margin: 0; padding-left: 18px; }
.views { display: flex; gap: 6px; margin-top: 8px; }
.views button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.audit { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
.audit .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 0 12px; border: 0; }
.audit .filters input, .audit .filters select { width: auto; min-width: 220px; }
table.log { border-collapse: collapse; width: 100%; background: var(--panel); }
table.log th, table.log td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.log th { color: var(--muted); font-weight: 500; }
table.log tr.active td { background: var(--accent-bg); }
a.doc { color: var(--accent); cursor: pointer; margin-right: 8px; }
[hidden] { display: none !important; }
@media (max-width: 760px) {
	body { height: auto; }
	main { grid-template-columns: 1fr; }
	aside { max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
	<div class="top">
		<div class="brand" id="brand" hidden></div>
		<div class="titles">
			<h1 id="title"></h1>
			<div class="scope" id="scope"></div>
		</div>
		<button class="help-button" id="help-button" type="button" aria-haspopup="dialog">?</button>
	</div>
	<div id="banner"></div>
	<nav class="views" id="views" role="tablist"></nav>
</header>
<section class="audit" id="audit" hidden></section>
<main id="documents">
	<aside>
		<div class="filters" id="filters"></div>
		<div class="count" id="count"></div>
		<div class="list" id="list"></div>
	</aside>
	<section class="detail" id="detail"></section>
</main>
<footer id="footer" hidden></footer>
<div class="overlay" id="help" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden></div>
<script>/*DOCARCHIVE_CORE*/</script>
<script>
const DATA = /*DOCARCHIVE_DATA*/;
const L = DATA.labels;
const PAGE = 100;
const ACTIVE = ["html", "htm", "xhtml", "xht", "svg", "svgz", "mht", "mhtml", "js", "xsl", "xslt"];
const docs = DATA.documents;
const byId = new Map(docs.map((doc) => [doc.id, doc]));
const CREDIT_URL = "https://github.com/EffizienzAgent/docarchive";
const HEX_COLOR = /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i;
const LOGO_URI = /^data:image\/(?:png|jpeg|gif|webp);base64,[A-Za-z0-9+\/]+={0,2}$/;
const state = { search: "", type: "", party: "", company: "", year: "", held: false, problems: false, shown: PAGE, current: null, cursor: null, file: 0 };
const entries = DATA.audit || [];
const log = { view: "documents", search: "", action: "", entry: null };

function h(tag, attrs, ...children) {
	const el = document.createElement(tag);
	for (const [key, value] of Object.entries(attrs || {})) {
		if (value === null || value === undefined || value === false) continue;
		if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
		else el.setAttribute(key, value === true ? "" : value);
	}
	for (const child of children.flat()) {
		if (child === null || child === undefined || child === false) continue;
		el.append(child instanceof Node ? child : document.createTextNode(String(child)));
	}
	return el;
}

const fmt = (text, ...args) => args.reduce((out, arg, i) => out.replace(`{${i}}`, arg), text);
const href = (path) => path.split("/").map(encodeURIComponent).join("/");
const { typeOf, party } = ViewerCore;
const ext = (file) => ((file.name || file.key || "").split(".").pop() || "").toLowerCase();

function options(values, all) {
	return [h("option", { value: "" }, all), ...values.map((value) => h("option", { value }, value))];
}

function unique(values) {
	return [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b));
}

function renderHeader() {
	const scope = DATA.scope;
	document.title = `${L.title} ${scope.export}`;
	document.getElementById("title").textContent = `${L.title} ${scope.export}`;
	const filters = Object.entries(scope.filters).filter(([, value]) => value).map(([key, value]) => `${L[key] || key}: ${value}`);
	const parts = [
		scope.parts > 1 ? fmt(L.part, scope.part, scope.parts) : null,
		`${L.exported_at}: ${scope.exported_at}`,
		`${L.target}: ${scope.target}`,
		...filters,
	].filter(Boolean);
	document.getElementById("scope").textContent = parts.join(" · ");
	if (DATA.mismatches.length) {
		document.getElementById("banner").append(h("div", { class: "banner" }, fmt(L.mismatches, DATA.mismatches.length)));
	}
}

function renderBrand() {
	const brand = DATA.brand || {};
	if (typeof brand.color === "string" && HEX_COLOR.test(brand.color)) {
		document.documentElement.style.setProperty("--accent", brand.color);
	}
	const box = document.getElementById("brand");
	const logo = typeof brand.logo === "string" && LOGO_URI.test(brand.logo) ? brand.logo : null;
	if (logo) box.append(h("img", { src: logo, alt: brand.name || "" }));
	if (brand.name) box.append(h("span", {}, brand.name));
	box.hidden = !box.childNodes.length;
	if (brand.credit) {
		const footer = document.getElementById("footer");
		footer.append(h("a", { href: CREDIT_URL, target: "_blank", rel: "noopener noreferrer" }, L.credit));
		footer.hidden = false;
	}
}

function renderHelp() {
	const rows = [
		[["j", "k", "↑", "↓"], L.key_move],
		[["Enter"], L.key_open],
		[["/"], L.key_search],
		[["Esc"], L.key_escape],
		[["←", "→"], L.key_files],
		[["?"], L.key_help],
	];
	const dialog = h("div", { class: "dialog" },
		h("h2", { id: "help-title" }, L.shortcuts),
		h("table", {}, rows.map(([keys, text]) => h("tr", {}, h("td", {}, keys.flatMap((key) => [h("kbd", {}, key), " "])), h("td", {}, text)))),
		h("button", { type: "button", onclick: () => toggleHelp(false) }, L.close));
	const overlay = document.getElementById("help");
	overlay.append(dialog);
	overlay.addEventListener("click", (event) => event.target === overlay && toggleHelp(false));
	document.getElementById("help-button").setAttribute("title", L.shortcuts);
	document.getElementById("help-button").setAttribute("aria-label", L.shortcuts);
	document.getElementById("help-button").addEventListener("click", () => toggleHelp(true));
}

function toggleHelp(open) {
	const overlay = document.getElementById("help");
	overlay.hidden = !open;
	if (open) overlay.querySelector("button").focus();
	else document.getElementById("help-button").blur();
}

function renderFilters() {
	const box = document.getElementById("filters");
	const bind = (el, key, prop = "value") => {
		el.addEventListener(prop === "checked" ? "change" : "input", () => {
			state[key] = el[prop];
			state.shown = PAGE;
			renderList();
		});
		return el;
	};
	box.append(
		bind(h("input", { type: "search", id: "search", placeholder: `${L.search} (/)`, "aria-label": L.search }), "search"),
		bind(h("select", { "aria-label": L.type }, options(unique(docs.map(typeOf)), L.all_types)), "type"),
		bind(h("select", { "aria-label": L.counterparty }, options(unique(docs.map(party)), L.all_counterparties)), "party"),
		bind(h("select", { "aria-label": L.own_company }, options(unique(docs.map((d) => d.own_company)), L.all_companies)), "company"),
		bind(h("select", { "aria-label": L.date }, options(unique(docs.map((d) => (d.date || "").slice(0, 4))).reverse(), L.all_years)), "year"),
		h("label", {}, bind(h("input", { type: "checkbox" }), "held", "checked"), " ", L.only_held),
		h("label", {}, bind(h("input", { type: "checkbox" }), "problems", "checked"), " ", L.only_problems),
	);
}

function filtered() {
	const term = state.search.trim().toLowerCase();
	return docs.filter((doc) =>
		(!term || [doc.title, doc.number, party(doc), doc.id].some((v) => (v || "").toLowerCase().includes(term))) &&
		(!state.type || typeOf(doc) === state.type) &&
		(!state.party || party(doc) === state.party) &&
		(!state.company || doc.own_company === state.company) &&
		(!state.year || (doc.date || "").startsWith(state.year)) &&
		(!state.held || doc.legal_hold) &&
		(!state.problems || !doc.verified),
	);
}

function renderList() {
	const rows = filtered();
	const list = document.getElementById("list");
	list.replaceChildren();
	document.getElementById("count").textContent = `${Math.min(rows.length, state.shown)} ${L.of} ${rows.length} ${L.documents}`;
	if (!rows.length) list.append(h("div", { class: "item muted" }, L.none));
	for (const doc of rows.slice(0, state.shown)) {
		list.append(
			h("div", { class: `item${doc.id === state.current ? " active" : ""}${doc.id === state.cursor ? " cursor" : ""}`, "data-id": doc.id, onclick: () => show(doc.id) },
				h("div", { class: "t" }, doc.title || doc.id,
					doc.legal_hold ? h("span", { class: "pill hold" }, L.legal_hold) : null,
					doc.verified ? null : h("span", { class: "pill bad" }, "!")),
				h("div", { class: "m" }, [doc.date, typeOf(doc), party(doc)].filter(Boolean).join(" · ")),
			),
		);
	}
	if (rows.length > state.shown) {
		list.append(h("button", { class: "more", onclick: () => { state.shown += PAGE; renderList(); } }, L.more));
	}
	return rows;
}

function preview(file) {
	if (!file.path) return h("div", { class: "body muted" }, L.problem);
	const kind = ext(file);
	if (ACTIVE.includes(kind)) return h("div", { class: "body muted" }, L.download_only);
	if (file.preview) {
		return [
			h("div", { class: "note" }, L.rendered_preview),
			h("div", { class: "body" }, h("iframe", { src: href(file.preview), sandbox: "", title: file.name || file.key })),
		];
	}
	if (kind === "pdf") return h("div", { class: "body" }, h("iframe", { src: href(file.path), title: file.name || file.key }));
	if (["png", "jpg", "jpeg", "gif", "webp"].includes(kind)) return h("div", { class: "body" }, h("img", { src: href(file.path), alt: file.name || "" }));
	if (["xml", "txt", "json"].includes(kind)) {
		return h("div", { class: "body" }, h("iframe", { src: href(file.path), sandbox: "", title: file.name || file.key }));
	}
	return h("div", { class: "body muted" }, L.no_preview);
}

function fileCard(file) {
	const active = ACTIVE.includes(ext(file));
	const open = h("a", { class: "btn primary", href: href(file.path || ""), target: "_blank", rel: "noopener" }, L.open_original);
	const download = h("a", { class: "btn", href: href(file.path || ""), download: file.name || "", type: "application/octet-stream" }, L.download_original);
	const actions = file.path ? (active ? [download] : [open, download]) : [];
	return h("div", { class: "card" },
		h("div", { class: "head" },
			h("span", { class: "name" }, file.title || file.name || file.key,
				file.role ? h("span", { class: "muted" }, ` · ${file.role_label || file.role}`) : null,
				file.verified ? null : h("span", { class: "pill bad" }, L.problem)),
			actions),
		preview(file));
}


function show(id, file = 0) {
	const doc = byId.get(id);
	if (!doc) return;
	state.current = id;
	state.cursor = id;
	state.file = Math.min(Math.max(file, 0), Math.max(doc.files.length - 1, 0));
	if (location.hash !== `#${encodeURIComponent(id)}`) history.replaceState(null, "", `#${encodeURIComponent(id)}`);
	const rows = renderList();
	const index = rows.findIndex((row) => row.id === id);
	const step = (delta) => rows[index + delta] && show(rows[index + delta].id);
	const detail = document.getElementById("detail");
	const thread = ViewerCore.threadOf(doc, docs);
	const title = doc.title || doc.id;
	detail.replaceChildren(...[
		h("div", { class: "nav" },
			h("h2", { title }, title),
			h("button", { onclick: () => step(-1), disabled: index <= 0, title: "k" }, L.previous),
			h("button", { onclick: () => step(1), disabled: index < 0 || index >= rows.length - 1, title: "j" }, L.next)),
		h("div", { class: "fields" }, ViewerCore.meta(doc, L).map(([key, label, value]) =>
			h("div", { class: `field${key === "status" && !doc.verified ? " bad" : ""}${key === "legal_hold" && value ? " hold" : ""}`, "data-field": key },
				h("div", { class: "label" }, label),
				h("div", { class: "value", title: value || null }, value || h("span", { class: "muted" }, "–"))))),
		h("div", { class: "tabs", role: "tablist", "aria-label": L.files }, doc.files.map((file, i) =>
			h("button", { type: "button", role: "tab", "aria-selected": String(i === state.file), title: file.name || file.key, onclick: () => show(id, i) },
				file.title || file.name || file.key))),
		doc.files.length ? fileCard(doc.files[state.file]) : null,
		thread.length > 1
			? h("div", { class: "card thread" },
				h("div", { class: "head" }, h("span", { class: "name" }, `${L.thread} (${thread.length})`)),
				thread.map((msg) => h("div", { class: `msg${msg.id === id ? " active" : ""}`, onclick: () => show(msg.id) },
					h("div", {}, msg.title || msg.id), h("div", { class: "muted" }, [msg.date, party(msg)].filter(Boolean).join(" · ")))))
			: null,
		doc.history.length
			? h("div", { class: "card" },
				h("div", { class: "head" }, h("span", { class: "name" }, L.retention_trail)),
				h("div", { class: "body" }, h("ul", { class: "plain" }, doc.history.map((entry) =>
					h("li", {}, `${entry.extended_at || ""}: ${entry.previous_retain_until || ""} → ${entry.retain_until || ""}`)))))
			: null,
		h("div", { class: "card" },
			h("div", { class: "head" }, h("span", { class: "name" }, L.metadata)),
			h("div", { class: "body" }, h("ul", { class: "plain" }, doc.metadata.map((file) =>
				h("li", {}, file.path ? h("a", { href: href(file.path), target: "_blank", rel: "noopener" }, file.key) : file.key,
					file.verified ? null : h("span", { class: "pill bad" }, L.problem)))))),
		auditCard(doc),
	].flat().filter(Boolean));
	detail.scrollTop = 0;
}

function renderViews() {
	document.getElementById("views").replaceChildren(
		...[["documents", L.documents_tab], ["audit", `${L.audit_tab} (${entries.length})`]].map(([view, label]) =>
			h("button", { type: "button", role: "tab", "aria-selected": String(log.view === view), onclick: () => showView(view) }, label)),
	);
}

function showView(view) {
	log.view = view;
	document.getElementById("documents").hidden = view !== "documents";
	document.getElementById("audit").hidden = view !== "audit";
	renderViews();
	if (view === "audit") renderAudit();
}

function openDocument(id) {
	showView("documents");
	show(id);
}

function openEntry(id) {
	Object.assign(log, { entry: id, search: "", action: "" });
	showView("audit");
	const row = document.getElementById(`entry-${id}`);
	if (row) row.scrollIntoView({ block: "center" });
}

function entryState(entry) {
	if (entry.pending) return h("span", { class: "pill hold" }, L.audit_pending);
	return entry.verified ? null : h("span", { class: "pill bad" }, L.problem);
}

function documentLinks(entry) {
	return entry.documents.map((row) => {
		const label = ViewerCore.outcomeOf(entry, row.id) ? `${row.id} (${ViewerCore.outcomeOf(entry, row.id)})` : row.id;
		return byId.has(row.id)
			? h("a", { class: "doc", onclick: () => openDocument(row.id) }, label)
			: h("span", { class: "muted", title: L.not_in_export }, `${label} `);
	});
}

function renderAudit() {
	const search = h("input", { type: "search", placeholder: L.audit_search, "aria-label": L.audit_search, value: log.search });
	search.addEventListener("input", () => { log.search = search.value; renderAuditTable(); });
	const action = h("select", { "aria-label": L.action }, options(unique(entries.map((entry) => entry.action)), L.all_actions));
	action.value = log.action;
	action.addEventListener("input", () => { log.action = action.value; renderAuditTable(); });
	document.getElementById("audit").replaceChildren(h("div", { class: "filters" }, search, action), h("div", { id: "audit-table" }));
	renderAuditTable();
}

function renderAuditTable() {
	const rows = ViewerCore.auditRows(entries, log);
	const table = document.getElementById("audit-table");
	if (!rows.length) return table.replaceChildren(h("p", { class: "muted" }, L.no_entries));
	table.replaceChildren(
		h("p", { class: "muted" }, `${rows.length} ${L.entries}`),
		h("table", { class: "log" },
			h("tr", {}, [L.at, L.user, L.action, L.documents, ""].map((label) => h("th", {}, label))),
			rows.map((entry) => h("tr", { id: `entry-${entry.id}`, class: entry.id === log.entry ? "active" : null },
				h("td", {}, entry.at),
				h("td", {}, entry.user),
				h("td", {}, entry.action, entryState(entry)),
				h("td", {}, documentLinks(entry)),
				h("td", {}, h("a", { href: href(entry.path), target: "_blank", rel: "noopener" }, L.stored_entry))))),
	);
}

function auditCard(doc) {
	const own = ViewerCore.entriesOf(doc, entries);
	if (!own.length) return null;
	return h("div", { class: "card" },
		h("div", { class: "head" }, h("span", { class: "name" }, L.audit_tab)),
		h("div", { class: "body" }, h("table", { class: "log" },
			h("tr", {}, [L.at, L.user, L.action, L.outcome].map((label) => h("th", {}, label))),
			own.map((entry) => h("tr", {},
				h("td", {}, h("a", { class: "doc", onclick: () => openEntry(entry.id) }, entry.at)),
				h("td", {}, entry.user),
				h("td", {}, entry.action),
				h("td", {}, ViewerCore.outcomeOf(entry, doc.id)))))));
}

function closePreview() {
	state.current = null;
	if (location.hash) history.replaceState(null, "", location.pathname + location.search);
	document.getElementById("detail").replaceChildren(h("div", { class: "muted" }, L.empty));
	renderList();
}

function moveCursor(delta) {
	const rows = filtered();
	const next = ViewerCore.move(rows.map((row) => row.id), state.cursor, delta);
	if (!next) return;
	state.cursor = next;
	const index = rows.findIndex((row) => row.id === next);
	if (index >= state.shown) state.shown = Math.ceil((index + 1) / PAGE) * PAGE;
	renderList();
	const item = document.querySelector(`.item[data-id="${CSS.escape(next)}"]`);
	if (item) item.scrollIntoView({ block: "nearest" });
}

function escape(target) {
	const search = document.getElementById("search");
	const todo = ViewerCore.escape({
		help: !document.getElementById("help").hidden,
		search: Boolean(state.search),
		typing: ViewerCore.typing(target),
		preview: Boolean(state.current),
	});
	if (todo === "clear_search") {
		search.value = "";
		state.search = "";
		state.shown = PAGE;
		renderList();
	}
	if (todo === "blur") target.blur();
	if (todo === "close_preview") closePreview();
}

document.addEventListener("keydown", (event) => {
	const target = event.target;
	const todo = ViewerCore.action(event, {
		help: !document.getElementById("help").hidden,
		typing: ViewerCore.typing(target),
		control: ViewerCore.control(target),
	});
	if (!todo || (log.view !== "documents" && !["help", "close_help"].includes(todo))) return;
	event.preventDefault();
	if (todo === "close_help") toggleHelp(false);
	if (todo === "help") toggleHelp(true);
	if (todo === "escape") escape(target);
	if (todo === "search") document.getElementById("search").focus();
	if (todo === "next") moveCursor(1);
	if (todo === "previous") moveCursor(-1);
	if (todo === "open" && state.cursor) show(state.cursor);
	const doc = byId.get(state.current);
	if (doc && (todo === "next_file" || todo === "previous_file")) {
		show(doc.id, ViewerCore.cycle(doc.files.length, state.file, todo === "next_file" ? 1 : -1));
	}
});

renderHeader();
renderViews();
renderBrand();
renderHelp();
renderFilters();
const start = decodeURIComponent(location.hash.slice(1));
const first = byId.has(start) ? start : docs[0] && docs[0].id;
if (first) show(first); else renderList();
</script>
</body>
</html>
